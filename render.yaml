# Render Blueprint — Scholars Education System API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: scholars-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://scholarseducationsystem-a6a4f.web.app
      # Prompted during blueprint creation — must be 32+ random characters.
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scholars-postgres
          property: connectionString

databases:
  - name: scholars-postgres
    plan: free
    databaseName: scholars
    user: scholars
