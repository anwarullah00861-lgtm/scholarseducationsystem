services:
  postgres:
    image: postgres:16-alpine
    container_name: scholars-postgres
    environment:
      POSTGRES_USER: scholars
      POSTGRES_PASSWORD: scholars
      POSTGRES_DB: scholars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholars -d scholars"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
